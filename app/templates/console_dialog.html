<dialog class="console-dialog" id="console-action-dialog" aria-labelledby="console-dialog-title" aria-describedby="console-dialog-description">
    <form id="console-action-form">
        <h2 id="console-dialog-title"></h2><p id="console-dialog-description"></p>
        <div id="console-dialog-fields" hidden><label for="console-dialog-amount">Amount in USD</label><input id="console-dialog-amount" name="amount" type="number" step="any" placeholder="e.g. 5 or -2.50"><label for="console-dialog-note">Note (optional)</label><input id="console-dialog-note" name="note" type="text" maxlength="500" placeholder="Reason for this adjustment"></div>
        <div class="console-dialog-actions"><button class="console-button" type="button" id="console-dialog-cancel">Cancel</button><button class="console-button primary" type="submit" id="console-dialog-confirm">Confirm</button></div>
    </form>
</dialog>
<div class="console-toast" id="console-toast" role="status" aria-live="polite" hidden></div>
